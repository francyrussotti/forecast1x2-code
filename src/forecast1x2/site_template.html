<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forecast 1X2</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forecast 1X2">
<meta name="theme-color" content="#16804c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root { --bg:#f6f7f5; --card:#fff; --ink:#18201b; --muted:#5d6b62; --line:#e2e6e3; --accent:#16804c;
        --good:#14804a; --bad:#b4372f; --warn:#9a6a00; --chip:#eef3ef; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0f1712; --card:#17221b; --ink:#e8efe9; --muted:#9db0a3; --line:#26352b; --accent:#3ccf85;
          --good:#3ccf85; --bad:#ff7a6e; --warn:#e8b33f; --chip:#1f2e25; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
       padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom)); }
header { padding:14px 16px 6px; }
h1 { font-size:22px; margin:0; } h2 { font-size:17px; margin:22px 0 8px; } h3 { font-size:15px; margin:0 0 6px; }
.muted { color:var(--muted); font-size:13px; }
main { padding:0 16px; max-width:900px; margin:0 auto; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:10px 0; }
.grid { display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); }
.leg { padding:6px 0; border-bottom:1px solid var(--line); } .leg:last-of-type { border-bottom:0; }
.big { font-size:22px; font-weight:700; }
.chip { display:inline-block; background:var(--chip); border-radius:999px; padding:1px 8px; font-size:12px; margin-right:4px; }
.good { color:var(--good); } .bad { color:var(--bad); } .warn { color:var(--warn); }
nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line);
      padding-bottom:env(safe-area-inset-bottom); z-index:5; }
nav button { flex:1; background:none; border:0; color:var(--muted); padding:12px 0; font-size:14px; }
nav button.on { color:var(--accent); font-weight:700; }
input, select, button.act { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
button.act { background:var(--accent); color:#fff; border:0; font-weight:600; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:600; font-size:12px; }
td.num, th.num { text-align:right; white-space:nowrap; }
td input { width:64px; padding:4px 6px; text-align:right; }
.scroll { overflow-x:auto; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.match { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px;
         padding:10px 12px; margin:8px 0; color:inherit; font:inherit; }
#lock { max-width:360px; margin:18vh auto 0; padding:0 16px; }
#lock input[type=password] { width:100%; margin:10px 0; }
.hidden { display:none !important; }
.note { background:var(--chip); border-radius:12px; padding:10px 12px; font-size:13px; color:var(--muted); }
.trust { border:2px solid var(--accent); }
.headline { font-size:20px; font-weight:700; line-height:1.3; margin:4px 0 8px; }
.bars { margin:10px 0 4px; } .bar { display:grid; grid-template-columns:96px 1fr 44px; gap:8px; align-items:center; margin:6px 0; font-size:13px; }
.track { position:relative; height:12px; background:var(--chip); border-radius:999px; overflow:hidden; }
.fill { position:absolute; left:0; top:0; bottom:0; border-radius:999px; }
.fill.pred { background:var(--muted); opacity:.45; } .fill.real { background:var(--accent); height:6px; top:3px; }
.badge { display:inline-block; border-radius:999px; padding:2px 10px; font-weight:700; font-size:13px; color:#fff; background:var(--accent); }
.badge.mid { background:var(--warn); } .badge.low { background:var(--bad); }
</style>
</head>
<body>
<div id="lock">
  <h1>Forecast 1X2</h1>
  <p class="muted">Contenuto protetto. Scrivi la password.</p>
  <form id="lockform">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <label class="row muted"><input id="remember" type="checkbox" checked> Ricorda su questo dispositivo</label>
    <p><button class="act" type="submit">Entra</button></p>
    <p id="lockmsg" class="bad"></p>
  </form>
</div>
<div id="app" class="hidden">
  <header><h1 id="title">Schedine pronte</h1><div id="updated" class="muted"></div></header>
  <main id="view"></main>
  <nav>
    <button data-tab="slips" class="on">Schedine</button><button data-tab="matches">Partite</button>
    <button data-tab="track">Verifica</button><button data-tab="info">Info</button>
  </nav>
</div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (v, d = 1) => v == null ? "—" : (v >= 0 ? "+" : "") + (100 * v).toFixed(d).replace(".", ",") + "%";
const num = (v, d = 2) => v == null ? "—" : Number(v).toFixed(d).replace(".", ",");
const fmt = new Intl.DateTimeFormat("it-IT", {timeZone: "Europe/Rome", weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"});
const when = iso => iso ? fmt.format(new Date(iso)) : "—";
const store = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
               del: k => { try { localStorage.removeItem(k); } catch (e) {} }};
let D = null, tab = "slips", openMatch = null;

async function unlock(password) {
  const blob = await (await fetch("data.json", {cache: "no-store"})).json();
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b(blob.salt), iterations: blob.iter, hash: "SHA-256"},
                                            base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b(blob.iv)}, key, b(blob.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function enter(password, remember) {
  try {
    D = await unlock(password);
    if (remember) store.set("f1x2-pw", password);
    $("#lock").classList.add("hidden"); $("#app").classList.remove("hidden");
    $("#updated").textContent = "Dati del " + when(D.updated) + (D.odds_fetched ? " · quote del " + when(D.odds_fetched) : "");
    render();
  } catch (e) {
    store.del("f1x2-pw");
    $("#lockmsg").textContent = "Password sbagliata (o dati non disponibili).";
  }
}

$("#lockform").addEventListener("submit", e => { e.preventDefault(); enter($("#pw").value, $("#remember").checked); });
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab; openMatch = null;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  render(); window.scrollTo(0, 0);
}));

function stake() { return Number(store.get("f1x2-stake") || 10); }
function bk(k) { return k ? (D.bookmakers[k] || k) : ""; }

function slipCard(title, s) {
  if (!s) return `<div class="card"><h3>${esc(title)}</h3><p class="muted">Nessuna combinazione possibile.</p></div>`;
  const st = stake(), legs = s.legs.map(l => `<div class="leg"><div class="muted">${when(l.kickoff)} · ${esc(l.league)}</div>
      <div>${esc(l.home)} – ${esc(l.away)}</div><div><b>${esc(l.market)}</b> @ ${num(l.odds)} <span class="chip">${esc(bk(l.bookmaker))}</span></div></div>`).join("");
  return `<div class="card">${title ? `<h3>${esc(title)}</h3>` : ""}${legs}
    <div class="row" style="justify-content:space-between;margin-top:8px"><span class="big">${num(s.odds)}</span>
    <span class="muted">vince ${Math.round(100 * s.prob)}% delle volte</span></div>
    <div class="muted">Con ${st} € incassi ${num(st * s.odds)} € se vince. In media: ${num(st * s.value)} € a giocata (${pct(s.value)}).</div></div>`;
}

function viewSlips() {
  const ks = [...new Set(D.custom.map(c => c.k))];
  if (!D.presets.length) return `<p class="muted">Nessuna partita con quote al momento: escono di solito il venerdì.</p>`;
  let k = Number(store.get("f1x2-k") || 2); if (!ks.includes(k)) k = ks[0];
  const obj = store.get("f1x2-obj") || "prob";
  const targets = D.custom.filter(c => c.k === k && c.objective === obj).map(c => c.target);
  let t = Number(store.get("f1x2-t") || targets[0]); if (!targets.includes(t)) t = targets[0];
  const found = D.custom.find(c => c.k === k && c.target === t && c.objective === obj);
  return `<div class="row"><label>Puntata € <input id="stake" type="number" min="1" step="1" value="${stake()}" style="width:80px"></label></div>
    <h2>Le più probabili</h2><div class="grid">${D.presets.map(p => slipCard(p.name, p.slip)).join("")}</div>
    <h2>Costruisci la tua</h2>
    <div class="row"><select id="selk">${ks.map(x => `<option value="${x}" ${x === k ? "selected" : ""}>${x} ${x === 1 ? "partita" : "partite"}</option>`).join("")}</select>
      <select id="selt">${targets.map(x => `<option value="${x}" ${x === t ? "selected" : ""}>quota ≥ ${num(x)}</option>`).join("")}</select>
      <select id="selo"><option value="prob" ${obj === "prob" ? "selected" : ""}>Più probabile</option><option value="value" ${obj === "value" ? "selected" : ""}>Miglior rendimento</option></select></div>
    ${k >= 4 ? `<p class="note">Con ${k} partite il margine del bookmaker si moltiplica: nello storico le quadruple hanno reso −12% e le cinquine −16%.</p>` : ""}
    <div class="grid">${found && found.slips.length ? found.slips.map((s, i) => slipCard("Alternativa " + (i + 1), s)).join("") : `<p class="muted">Nessuna combinazione con questi valori.</p>`}</div>
    <p class="muted">Le alternative non hanno partite in comune. Controlla sempre la quota sul sito del bookmaker prima di giocare.</p>`;
}

function bindSlips() {
  const on = (id, f) => { const el = $(id); if (el) el.addEventListener("change", f); };
  on("#stake", e => { store.set("f1x2-stake", Math.max(1, Number(e.target.value) || 10)); render(); });
  on("#selk", e => { store.set("f1x2-k", e.target.value); render(); });
  on("#selt", e => { store.set("f1x2-t", e.target.value); render(); });
  on("#selo", e => { store.set("f1x2-obj", e.target.value); render(); });
}

function viewMatches() {
  if (openMatch !== null) return viewMatch(D.matches[openMatch]);
  if (!D.matches.length) return `<p class="muted">Nessuna partita con quote: escono di solito il venerdì.</p>`;
  return D.matches.map(m => `<button class="match" data-id="${m.id}"><div class="muted">${when(m.kickoff)} · ${esc(m.league)}</div>
      <div><b>${esc(m.home)} – ${esc(m.away)}</b></div>
      <div class="muted">${m.best ? `Più probabile: <b>${esc(m.best.market)}</b> @ ${num(m.best.odds)} (${Math.round(100 * m.best.prob)}%) · ${esc(bk(m.best.bookmaker))}` : "Nessuna giocata nelle regole"}</div></button>`).join("");
}

function judge(p, fair, err, o) {
  if (!o || o <= 1) return {v: null, s: null, txt: ""};
  const v = o * p - 1, e = Math.abs(err || 0) / 100 * o, sus = o > 2 * fair;
  const s = sus ? 0 : Math.min(0.05, Math.max(0, 0.25 * v / (o - 1)));
  const txt = sus ? `<span class="warn">quota sospetta</span>` : v <= 0 ? `<span class="bad">nessun valore</span>`
            : v <= e ? `<span class="warn">entro l'errore</span>` : `<span class="good">valore</span>`;
  return {v, s, txt};
}

function viewMatch(m) {
  const groups = [...new Set(m.markets.map(x => x.g))];
  const pickTxt = (lab, p) => p ? `<div><span class="muted">${lab}:</span> <b>${esc(p.market)}</b> @ ${num(p.odds)} · ${esc(bk(p.bookmaker))} · vince ${Math.round(100 * p.prob)}% · costo ${pct(p.value)}</div>` : "";
  return `<p><button class="act" id="back">‹ Partite</button></p>
    <div class="card"><div class="muted">${when(m.kickoff)} · ${esc(m.league)}</div><h3>${esc(m.home)} – ${esc(m.away)}</h3>
      <div class="muted">Gol attesi ${num(m.xg[0])} – ${num(m.xg[1])}</div>${pickTxt("Più probabile", m.best)}${pickTxt("Più conveniente", m.cheap)}</div>
    <p class="note">«Quota» è già compilata con la migliore tra i bookmaker seguiti: scrivi la quota del tuo per vedere il valore. «Puntata» è la percentuale del budget per le scommesse (un quarto di Kelly, al massimo il 5%).</p>
    ${groups.map(g => `<h2>${esc(g)}</h2><div class="scroll"><table><tr><th>Mercato</th><th class="num">Prob.</th><th class="num">Giusta</th><th class="num">Quota</th><th>Valore</th><th class="num">Puntata</th></tr>
      ${m.markets.map((x, i) => x.g !== g ? "" : `<tr data-i="${i}"><td>${esc(x.m)}${x.bk ? `<div class="muted">${esc(bk(x.bk))}</div>` : ""}</td>
        <td class="num">${Math.round(100 * x.p)}%</td><td class="num">${num(x.fair)}</td>
        <td class="num"><input inputmode="decimal" value="${x.odds ? num(x.odds) : ""}"></td><td class="val"></td><td class="num stk"></td></tr>`).join("")}</table></div>`).join("")}
    ${m.exotic.length ? `<h2>Combo e Multigoal da cercare</h2><div class="scroll"><table><tr><th>Mercato</th><th class="num">Prob.</th><th class="num">Giusta</th><th class="num">Gioca solo da</th></tr>
      ${m.exotic.map(e => `<tr><td>${esc(e.g)}: ${esc(e.m)}</td><td class="num">${Math.round(100 * e.p)}%</td><td class="num">${num(e.fair)}</td><td class="num">${num(e.min)}</td></tr>`).join("")}</table></div>` : ""}`;
}

function bindMatches() {
  document.querySelectorAll(".match").forEach(b => b.addEventListener("click", () => { openMatch = Number(b.dataset.id); render(); window.scrollTo(0, 0); }));
  const back = $("#back"); if (back) back.addEventListener("click", () => { openMatch = null; render(); });
  if (openMatch === null) return;
  const m = D.matches[openMatch];
  document.querySelectorAll("tr[data-i]").forEach(tr => {
    const x = m.markets[Number(tr.dataset.i)], inp = $("input", tr);
    const upd = () => { const o = Number(String(inp.value).replace(",", ".")); const j = judge(x.p, x.fair, x.err, o);
      $(".val", tr).innerHTML = j.v == null ? "" : `${pct(j.v)} ${j.txt}`;
      $(".stk", tr).textContent = j.s ? `${num(100 * j.s, 1)}%` : ""; };
    inp.addEventListener("input", upd); upd();
  });
}

function trackTable(rows, label) {
  if (!rows.length) return `<p class="muted">Ancora nessuna giocata conclusa.</p>`;
  return `<div class="scroll"><table><tr><th>${esc(label)}</th><th class="num">Giocate</th><th class="num">Vinte</th><th class="num">Rendimento</th><th class="num">CLV medio</th></tr>
    ${rows.map(r => `<tr><td>${esc(r.group)}</td><td class="num">${r.bets}</td><td class="num">${r.wins}</td>
      <td class="num">${pct(r.roi)}<div class="muted">${pct(r.roi_lo)} … ${pct(r.roi_hi)}</div></td>
      <td class="num">${pct(r.clv)}<div class="muted">${pct(r.clv_lo)} … ${pct(r.clv_hi)}</div></td></tr>`).join("")}</table></div>`;
}

function trustCard(r) {
  if (!r || !r.n) return `<div class="card trust"><h3>Quanto ci si può fidare</h3><p class="muted">Servono le prime partite concluse: la misura compare da sola.</p></div>`;
  const P = v => Math.round(100 * v) + "%";
  const cls = r.verdict === "ottima" ? "" : r.verdict === "buona" ? "mid" : "low";
  const bars = r.bands.map(b => `<div class="bar"><span>${esc(b.label)}<div class="muted">${b.n} giocate</div></span>
      <div class="track"><div class="fill pred" style="width:${100 * b.pred}%"></div><div class="fill real" style="width:${100 * b.actual}%"></div></div>
      <b>${P(b.actual)}</b></div>`).join("");
  const edge = r.clv == null ? "" : r.clv > 0
    ? `<p><b class="good">Vantaggio sul bookmaker: sì</b> — le quote prese sono in media ${pct(r.clv)} migliori di quelle finali.</p>`
    : `<p><b class="warn">Vantaggio sul bookmaker: non ancora</b> — le probabilità sono giuste, ma le quote prese sono in media ${pct(r.clv)} rispetto a quelle finali: il margine del bookmaker resta.</p>`;
  return `<div class="card trust"><h3>Quanto ci si può fidare</h3>
    <div class="headline">Quando diciamo ${P(r.pred)}, si vince il ${P(r.actual)} delle volte.</div>
    <div class="row"><span class="badge ${cls}">Affidabilità ${esc(r.verdict)}</span><span class="muted">scarto medio ${num(100 * r.gap, 1)} punti · ${r.n} giocate dal ${esc(r.since.split("-").reverse().join("/"))} · misura ${esc(r.strength)}</span></div>
    <div class="bars">${bars}</div>
    <div class="muted">Barra chiara = probabilità prevista · barra verde = quante volte si è vinto davvero. Più le due coincidono, più ci si può fidare.</div>
    ${r.slips ? `<p class="muted">Schedine pronte: previste vinte ${P(r.slips.pred)}, vinte ${P(r.slips.actual)} (${r.slips.n}).</p>` : ""}
    ${edge}</div>`;
}

function viewTrack() {
  const t = D.tracking;
  return `${trustCard(t.reliability)}<p class="note">Ogni consiglio viene salvato prima della partita e non si modifica più. Il <b>CLV</b> confronta la quota presa con la probabilità del mercato alla chiusura: in media positivo = le quote prese erano migliori di quelle finali. Diventa leggibile dopo 3-4 settimane; il rendimento dopo una stagione. Sotto ogni valore, l'intervallo di confidenza al 95%.</p>
    <div class="row"><span class="chip">Registrate ${t.logged}</span><span class="chip">Concluse ${t.settled}</span><span class="chip">In attesa ${t.open}</span></div>
    <h2>Giocate singole</h2>${trackTable(t.by_kind, "Tipo")}
    <h2>Per mercato</h2>${trackTable(t.by_group, "Mercato")}
    <h2>Per bookmaker</h2>${trackTable(t.by_book, "Bookmaker")}
    <h2>Schedine pronte</h2>${trackTable(t.slips, "Schedina")}
    ${t.ou.length ? `<h2>Consigli in prova over/under</h2>${trackTable(t.ou, "Registro")}` : ""}
    <h2>Ultime concluse</h2><div class="scroll"><table><tr><th>Partita</th><th>Giocata</th><th>Esito</th><th class="num">CLV</th></tr>
    ${t.recent.map(r => `<tr><td><div class="muted">${when(r.kickoff)}</div>${esc(r.match)}</td><td>${esc(r.market)} @ ${num(r.odds)}<div class="muted">${esc(r.bookmaker)}</div></td>
      <td class="${r.status === "vinta" ? "good" : r.status === "persa" ? "bad" : ""}">${esc(r.status)}</td><td class="num">${pct(r.clv)}</td></tr>`).join("")}</table></div>`;
}

function viewInfo() {
  return `<p class="note">${esc(D.disclaimer)}</p>
    <h2>Come sono scelte le giocate</h2>
    <p>La giocata più probabile di ogni partita, con quota tra ${num(D.rules.min_odds)} e ${num(D.rules.max_odds)} e costo atteso non peggiore di ${pct(-D.rules.max_cost, 0)}, presa al bookmaker con la quota migliore tra ${esc(Object.values(D.bookmakers).join(", "))}. Mai due giocate della stessa partita in una multipla (per quello ci sono i Combo). Al massimo 2-3 partite: ogni partita in più moltiplica il margine del bookmaker.</p>
    <h2>Lo storico (verifica 2024/25-2025/26)</h2><table><tr><th>Come giocare</th><th class="num">Vinte</th><th class="num">Rendimento</th></tr>
    ${D.history.map(h => `<tr><td>${esc(h[0])}</td><td class="num">${esc(h[1])}</td><td class="num">${esc(h[2])}</td></tr>`).join("")}</table>
    <h2>Su iPhone</h2><p>In Safari: Condividi → «Aggiungi alla schermata Home». Si apre come un'app.</p>
    <p><button class="act" id="logout">Esci e dimentica la password</button></p>`;
}

function render() {
  const titles = {slips: "Schedine pronte", matches: "Partite", track: "Verifica dei consigli", info: "Info"};
  $("#title").textContent = titles[tab];
  $("#view").innerHTML = tab === "slips" ? viewSlips() : tab === "matches" ? viewMatches() : tab === "track" ? viewTrack() : viewInfo();
  if (tab === "slips") bindSlips();
  if (tab === "matches") bindMatches();
  if (tab === "info") $("#logout").addEventListener("click", () => { store.del("f1x2-pw"); location.reload(); });
}

const saved = store.get("f1x2-pw");
if (saved) enter(saved, true);
</script>
</body>
</html>
