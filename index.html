<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forecast 1X2</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forecast 1X2">
<meta name="theme-color" content="#16804c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root { --bg:#f6f7f5; --card:#fff; --ink:#18201b; --muted:#5d6b62; --line:#e2e6e3; --accent:#16804c;
        --good:#14804a; --bad:#b4372f; --warn:#9a6a00; --chip:#eef3ef; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0f1712; --card:#17221b; --ink:#e8efe9; --muted:#9db0a3; --line:#26352b; --accent:#3ccf85;
          --good:#3ccf85; --bad:#ff7a6e; --warn:#e8b33f; --chip:#1f2e25; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
       padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom)); }
header { padding:14px 16px 6px; position:sticky; top:0; z-index:6; background:var(--bg); }
.head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
#burger { flex:none; width:44px; height:44px; border:1px solid var(--line); border-radius:12px; background:var(--card);
          color:var(--ink); display:grid; place-items:center; padding:0; }
#burger span, #burger span::before, #burger span::after { display:block; width:20px; height:2px; border-radius:2px;
          background:currentColor; position:relative; content:""; }
#burger span::before { position:absolute; top:-6px; } #burger span::after { position:absolute; top:6px; }
#burger[aria-expanded="true"] span { background:transparent; }
#burger[aria-expanded="true"] span::before { top:0; transform:rotate(45deg); }
#burger[aria-expanded="true"] span::after { top:0; transform:rotate(-45deg); }
#shade { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:7; }
h1 { font-size:22px; margin:0; } h2 { font-size:17px; margin:22px 0 8px; } h3 { font-size:15px; margin:0 0 6px; }
.muted { color:var(--muted); font-size:13px; }
main { padding:0 16px; max-width:900px; margin:0 auto; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:10px 0; }
.grid { display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); }
.leg { padding:6px 0; border-bottom:1px solid var(--line); } .leg:last-of-type { border-bottom:0; }
.big { font-size:22px; font-weight:700; }
.chip { display:inline-block; background:var(--chip); border-radius:999px; padding:1px 8px; font-size:12px; margin-right:4px; }
.good { color:var(--good); } .bad { color:var(--bad); } .warn { color:var(--warn); }
nav { position:fixed; top:calc(env(safe-area-inset-top) + 66px); right:max(12px, env(safe-area-inset-right)); width:min(280px, calc(100vw - 24px));
      background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.25);
      padding:6px; z-index:8; display:flex; flex-direction:column; }
nav button { background:none; border:0; color:var(--ink); padding:13px 14px; text-align:left; font-size:16px; border-radius:10px; }
nav button + button { border-top:1px solid var(--line); border-radius:0; }
select, input, textarea { max-width:100%; } select { text-overflow:ellipsis; }
html, body { overflow-x:hidden; }
nav button.on { color:var(--accent); font-weight:700; background:var(--chip); border-radius:10px; }
input, select, button.act { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
button.act { background:var(--accent); color:#fff; border:0; font-weight:600; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:600; font-size:12px; }
td.num, th.num { text-align:right; white-space:nowrap; }
td input { width:64px; padding:4px 6px; text-align:right; }
.scroll { overflow-x:auto; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.match { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px;
         padding:10px 12px; margin:8px 0; color:inherit; font:inherit; }
.segs { display:flex; background:var(--chip); border-radius:12px; padding:3px; margin:10px 0; }
.segs button.seg { flex:1; border:0; background:none; color:inherit; font:inherit; padding:8px; border-radius:10px; }
.segs button.seg.on { background:var(--card); font-weight:700; color:var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.15); }
h2.cal-day { font-size:15px; margin:18px 0 4px; } h2.cal-day::first-letter { text-transform:uppercase; }
.cal-row { display:grid; grid-template-columns:52px 1fr; gap:8px; padding:8px 4px; border-bottom:1px solid var(--line); }
.cal-link { cursor:pointer; } .cal-link:hover { background:var(--chip); border-radius:8px; }
.cal-h { font-variant-numeric:tabular-nums; font-weight:600; padding-top:1px; }
.cal-m { min-width:0; } .cal-m b { overflow-wrap:anywhere; }
.cal-p { display:flex; gap:6px; margin-top:4px; font-size:12px; } .cal-p span { background:var(--chip); border-radius:999px; padding:1px 8px; }
#lock { max-width:360px; margin:18vh auto 0; padding:0 16px; }
#lock input[type=password] { width:100%; margin:10px 0; }
.hidden { display:none !important; }
.note { background:var(--chip); border-radius:12px; padding:10px 12px; font-size:13px; color:var(--muted); }
.trust { border:2px solid var(--accent); }
.headline { font-size:20px; font-weight:700; line-height:1.3; margin:4px 0 8px; }
.bars { margin:10px 0 4px; } .bar { display:grid; grid-template-columns:96px 1fr 44px; gap:8px; align-items:center; margin:6px 0; font-size:13px; }
.track { position:relative; height:12px; background:var(--chip); border-radius:999px; overflow:hidden; }
.fill { position:absolute; left:0; top:0; bottom:0; border-radius:999px; }
.fill.pred { background:var(--muted); opacity:.45; } .fill.real { background:var(--accent); height:6px; top:3px; }
.badge { display:inline-block; border-radius:999px; padding:2px 10px; font-weight:700; font-size:13px; color:#fff; background:var(--accent); }
.surv { display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center; }
.surv.used { opacity:.5; } .surv.top { border:2px solid var(--accent); }
.badge.mid { background:var(--warn); } .badge.low { background:var(--bad); }
.eq { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; background:var(--chip); border-radius:10px;
      padding:8px 10px; overflow-x:auto; white-space:pre-wrap; overflow-wrap:anywhere; margin:6px 0; }
.step { display:inline-block; min-width:22px; text-align:center; border-radius:999px; background:var(--accent); color:#fff;
        font-size:12px; font-weight:700; margin-right:6px; }

</style>
</head>
<body>
<div id="lock">
  <h1>Forecast 1X2</h1>
  <p class="muted">Contenuto protetto. Scrivi la password.</p>
  <form id="lockform">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <label class="row muted"><input id="remember" type="checkbox" checked> Ricorda su questo dispositivo</label>
    <p><button class="act" type="submit">Entra</button></p>
    <p id="lockmsg" class="bad"></p>
  </form>
</div>
<div id="app" class="hidden">
  <header><div class="head"><h1 id="title">Schedine pronte</h1>
    <button id="burger" aria-label="Menu" aria-expanded="false" aria-controls="menu"><span></span></button></div>
    <div id="updated" class="muted"></div></header>
  <main id="view"></main>
  <div id="shade" class="hidden"></div>
  <nav id="menu" class="hidden">
    <button data-tab="slips" class="on">Schedine</button><button data-tab="matches">Partite</button>
    <button data-tab="strat">Strategia</button><button data-tab="surv">Survival</button>
    <button data-tab="track">Verifica</button><button data-tab="model">Modello</button><button data-tab="info">Info</button>
  </nav>
</div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (v, d = 1) => v == null ? "—" : (v >= 0 ? "+" : "") + (100 * v).toFixed(d).replace(".", ",") + "%";
const num = (v, d = 2) => v == null ? "—" : Number(v).toFixed(d).replace(".", ",");
const fmt = new Intl.DateTimeFormat("it-IT", {timeZone: "Europe/Rome", weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"});
const when = iso => iso ? fmt.format(new Date(iso)) : "—";
const store = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
               del: k => { try { localStorage.removeItem(k); } catch (e) {} }};
let D = null, tab = "slips", openMatch = null;

async function unlock(password) {
  const blob = await (await fetch("data.json", {cache: "no-store"})).json();
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b(blob.salt), iterations: blob.iter, hash: "SHA-256"},
                                            base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b(blob.iv)}, key, b(blob.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function enter(password, remember) {
  try {
    D = await unlock(password);
    if (remember) store.set("f1x2-pw", password);
    $("#lock").classList.add("hidden"); $("#app").classList.remove("hidden");
    $("#updated").textContent = "Dati del " + when(D.updated) + (D.odds_fetched ? " · quote del " + when(D.odds_fetched) : "");
    render();
  } catch (e) {
    store.del("f1x2-pw");
    $("#lockmsg").textContent = "Password sbagliata (o dati non disponibili).";
  }
}

$("#lockform").addEventListener("submit", e => { e.preventDefault(); enter($("#pw").value, $("#remember").checked); });
function menu(open) {
  $("#menu").classList.toggle("hidden", !open); $("#shade").classList.toggle("hidden", !open);
  $("#burger").setAttribute("aria-expanded", open ? "true" : "false");
}
$("#burger").addEventListener("click", () => menu($("#menu").classList.contains("hidden")));
$("#shade").addEventListener("click", () => menu(false));
document.addEventListener("keydown", e => { if (e.key === "Escape") menu(false); });
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab; openMatch = null;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  menu(false); render(); window.scrollTo(0, 0);
}));

function stake() { return Number(store.get("f1x2-stake") || 10); }
function book() { return Object.keys(D.bookmakers || {}).length > 1 ? (store.get("f1x2-book") || "all") : "pw"; }   // "all" = migliore tra i conti dell'utente (Planetwin365 + bet365, dal 18/11/2026), "pw" = solo Planetwin365
function V() { return (D.variants && D.variants[book()]) || D; }
function bookLabel() { return book() === "pw" ? "Planetwin365" : "migliore tra " + Object.values(D.bookmakers).join(", "); }
function bk(k) { return k ? (D.bookmakers[k] || k) : ""; }

function absentNote(l) {   // absent starters of both teams (already in the odds: late ones are excluded)
  const A = D.absent || {}, out = [l.home, l.away].map(t => (A[l.code + "|" + t] || []).length
    ? `${esc(t)}: ${A[l.code + "|" + t].map(p => `${esc(p.player)} (${p.games}/${p.team_games})`).join(", ")}` : "").filter(x => x);
  return out.length ? `<div class="muted">Titolari assenti: ${out.join("; ")}</div>` : "";
}

function slipCard(title, s, st0) {
  if (!s) return `<div class="card"><h3>${esc(title)}</h3><p class="muted">Nessuna combinazione possibile.</p></div>`;
  const st = st0 || stake(), legs = s.legs.map(l => `<div class="leg"><div class="muted">${when(l.kickoff)} · ${esc(l.league)}</div>
      <div>${esc(l.home)} – ${esc(l.away)}</div><div><b>${esc(l.market)}</b> @ ${num(l.odds)} <span class="chip">${esc(bk(l.bookmaker))}</span></div>${absentNote(l)}</div>`).join("");
  return `<div class="card">${title ? `<h3>${esc(title)}</h3>` : ""}${legs}
    <div class="row" style="justify-content:space-between;margin-top:8px"><span class="big">${num(s.odds)}</span>
    <span class="muted">vince ${Math.round(100 * s.prob)}% delle volte</span></div>
    <div class="muted">Con ${st} € incassi ${num(st * s.odds)} € se vince. In media: ${num(st * s.value)} € a giocata (${pct(s.value)}).</div></div>`;
}

function systemCard(title, s) {   // s: per 1 € of total stake
  if (!s) return `<div class="card"><h3>${esc(title)}</h3><p class="muted">Nessuna combinazione possibile.</p></div>`;
  const st = stake(), legs = s.legs.map(l => `<div class="leg"><div class="muted">${when(l.kickoff)} · ${esc(l.league)}</div>
      <div>${esc(l.home)} – ${esc(l.away)}</div><div><b>${esc(l.market)}</b> @ ${num(l.odds)} <span class="chip">${esc(bk(l.bookmaker))}</span></div>${absentNote(l)}</div>`).join("");
  return `<div class="card"><h3>${esc(title)}</h3>${legs}
    <div class="row" style="justify-content:space-between;margin-top:8px"><span class="big">${Math.round(100 * s.win)}%</span>
    <span class="muted">incassi qualcosa; in utile ${Math.round(100 * s.profit)}% delle volte</span></div>
    <div class="muted">${s.bets} multiple da ${num(st / s.bets)} € (${st} € in tutto). Incassi da ${num(st * s.min)} € a ${num(st * s.max)} €. In media: ${num(st * s.value)} € a giocata (${pct(s.value)}).</div></div>`;
}

function viewSlips() {
  const S = V(), ks = [...new Set(S.custom.map(c => c.k))];
  if (!S.presets.length) return `<p class="muted">Nessuna partita con quote ${esc(bookLabel())} al momento: escono di solito il venerdì.</p>`;
  let k = Number(store.get("f1x2-k") || 2); if (!ks.includes(k)) k = ks[0];
  const obj = store.get("f1x2-obj") || "prob";
  const targets = S.custom.filter(c => c.k === k && c.objective === obj).map(c => c.target);
  let t = Number(store.get("f1x2-t") || targets[0]); if (!targets.includes(t)) t = targets[0];
  const found = S.custom.find(c => c.k === k && c.target === t && c.objective === obj);
  return `<div class="row"><label>Puntata € <input id="stake" type="number" min="1" step="1" value="${stake()}" style="width:80px"></label>
    <span class="chip">Quote: ${esc(bookLabel())}</span></div>
    ${(D.late || []).length ? `<p class="note">Escluse dai consigli (titolare assente annunciato dopo le quote usate per le probabilità): ${D.late.map(x => `${esc(x.home)} – ${esc(x.away)}: ${x.players.map(esc).join(", ")}`).join("; ")}</p>` : ""}
    <h2>Le più probabili</h2><div class="grid">${S.presets.map(p => slipCard(p.name, p.slip)
      + (p.k >= 4 && p.slip ? `<p class="note">Nello storico: ${p.k === 4 ? "quadruple −12%" : "cinquine −16%"}, doppie −4%.</p>` : "")
      + ((p.alts || []).length ? `<details><summary class="muted">Altre ${p.alts.length} senza partite in comune</summary>${p.alts.map((s, i) => slipCard("Alternativa " + (i + 2), s)).join("")}</details>` : "")
    ).map(h => `<div>${h}</div>`).join("")}</div>
    ${(S.systems || []).length ? `<h2>Sistemi</h2>
    <p class="muted">Un sistema gioca tutte le multiple possibili tra le stesse partite, dividendo la puntata: si incassa qualcosa anche sbagliandone una. Vince più spesso della multipla, ma a parità di puntata incassa meno.</p>
    <div class="grid">${S.systems.map(x => systemCard(x.name, x.sys)).join("")}</div>` : ""}
    <h2>Costruisci la tua</h2>
    <div class="row"><select id="selk">${ks.map(x => `<option value="${x}" ${x === k ? "selected" : ""}>${x} ${x === 1 ? "partita" : "partite"}</option>`).join("")}</select>
      <select id="selt">${targets.map(x => `<option value="${x}" ${x === t ? "selected" : ""}>quota ≥ ${num(x)}</option>`).join("")}</select>
      <select id="selo"><option value="prob" ${obj === "prob" ? "selected" : ""}>Più probabile</option><option value="value" ${obj === "value" ? "selected" : ""}>Miglior rendimento</option></select></div>
    ${k >= 4 ? `<p class="note">Con ${k} partite il margine del bookmaker si moltiplica: nello storico le quadruple hanno reso −12% e le cinquine −16%.</p>` : ""}
    <div class="grid">${found && found.slips.length ? found.slips.map((s, i) => slipCard("Alternativa " + (i + 1), s)).join("") : `<p class="muted">Nessuna combinazione con questi valori.</p>`}</div>
    <p class="muted">Le alternative non hanno partite in comune. Controlla sempre la quota sul sito del bookmaker prima di giocare.</p>`;
}

function bindSlips() {
  const on = (id, f) => { const el = $(id); if (el) el.addEventListener("change", f); };
  on("#stake", e => { store.set("f1x2-stake", Math.max(1, Number(e.target.value) || 10)); render(); });
  on("#selk", e => { store.set("f1x2-k", e.target.value); render(); });
  on("#selt", e => { store.set("f1x2-t", e.target.value); render(); });
  on("#selo", e => { store.set("f1x2-obj", e.target.value); render(); });
}

const dayFmt = new Intl.DateTimeFormat("it-IT", {timeZone: "Europe/Rome", weekday: "long", day: "numeric", month: "long"});
const hourFmt = new Intl.DateTimeFormat("it-IT", {timeZone: "Europe/Rome", hour: "2-digit", minute: "2-digit"});

function matchesSwitch(mode) {
  const b = (v, lab) => `<button class="seg${mode === v ? " on" : ""}" data-mview="${v}">${lab}</button>`;
  return `<div class="segs">${b("odds", "Con quote")}${b("cal", "Calendario")}</div>`;
}

function viewCalendar() {
  const cal = D.calendar || [];
  if (!cal.length) return `<p class="muted">Nessuna partita in calendario nei prossimi 14 giorni.</p>`;
  const leagues = [...new Set(cal.map(c => c.league))];
  let lg = store.get("f1x2-cal-lg") || ""; if (lg && !leagues.includes(lg)) lg = "";
  const rows = cal.filter(c => !lg || c.league === lg);
  const days = [];
  rows.forEach(c => { const d = dayFmt.format(new Date(c.kickoff));
    if (!days.length || days[days.length - 1].d !== d) days.push({d, list: []}); days[days.length - 1].list.push(c); });
  const prob = c => c.p ? `<span class="cal-p"><span>1 ${Math.round(100 * c.p[0])}%</span><span>X ${Math.round(100 * c.p[1])}%</span><span>2 ${Math.round(100 * c.p[2])}%</span></span>` : "";
  return `<div class="row"><select id="cal-lg"><option value="">Tutti i campionati</option>${leagues.map(x => `<option ${x === lg ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>
      <span class="muted">${rows.length} partite nei prossimi 14 giorni</span></div>
    ${days.map(g => `<h2 class="cal-day">${esc(g.d)}</h2>${g.list.map(c => `<div class="cal-row${c.mid != null ? " cal-link" : ""}"${c.mid != null ? ` data-id="${c.mid}" role="button" tabindex="0"` : ""}>
        <div class="cal-h">${hourFmt.format(new Date(c.kickoff))}</div>
        <div class="cal-m"><div><b>${esc(c.home)} – ${esc(c.away)}</b></div>
          <div class="muted">${esc(c.league)}${c.round ? ` · giornata ${c.round}` : ""}${c.mid != null ? ` · <span class="good">quote ›</span>` : ""}</div>${prob(c)}</div></div>`).join("")}`).join("")}
    <p class="muted">Percentuali 1X2 del modello dove la previsione c'è già (di solito per la prossima giornata). Tocca una partita con «quote ›» per il dettaglio dei mercati.</p>`;
}

function viewMatches() {
  if (openMatch !== null) return viewMatch(D.matches[openMatch]);
  const mode = store.get("f1x2-mview") || "odds";
  if (mode === "cal") return matchesSwitch(mode) + viewCalendar();
  if (!D.matches.length) return matchesSwitch(mode) + `<p class="muted">Nessuna partita con quote: escono di solito il venerdì. Le prossime partite sono nel Calendario.</p>`;
  const pw = book() === "pw";
  return matchesSwitch(mode) + D.matches.map(m => { const b = pw ? m.best_pw : m.best;
    return `<button class="match" data-id="${m.id}"><div class="muted">${when(m.kickoff)} · ${esc(m.league)}</div>
      <div><b>${esc(m.home)} – ${esc(m.away)}</b></div>
      <div class="muted">${b ? `Più probabile: <b>${esc(b.market)}</b> @ ${num(b.odds)} (${Math.round(100 * b.prob)}%) · ${esc(bk(b.bookmaker))}` : pw ? "Nessuna quota Planetwin365 nelle regole" : "Nessuna giocata nelle regole"}</div></button>`; }).join("");
}

function judge(p, fair, err, o) {
  if (!o || o <= 1) return {v: null, s: null, txt: ""};
  const v = o * p - 1, e = Math.abs(err || 0) / 100 * o, sus = o > 2 * fair;
  const s = sus ? 0 : Math.min(0.05, Math.max(0, 0.25 * v / (o - 1)));
  const txt = sus ? `<span class="warn">quota sospetta</span>` : v <= 0 ? `<span class="bad">nessun valore</span>`

function survLocal() { try { return JSON.parse(store.get("f1x2-surv") || "[]"); } catch (e) { return []; } }
function survPicks() {   // file in the repository + picks tapped on this device; the file wins for the same round
  const S = D.survivor, byRound = {};
  survLocal().forEach(p => { if (p.season === S.season) byRound[p.round] = {...p, local: true}; });
  S.picks.forEach(p => { if (p.season === S.season) byRound[p.round] = {...p, local: false}; });
  return Object.values(byRound).sort((a, b) => a.round - b.round);
}
function survOutcome(p) {
  const days = d => new Date(d + "T12:00:00Z").getTime() / 864e5;
  const r = (D.survivor.results[p.team] || []).find(x => Math.abs(days(x[0]) - days(p.date)) <= 1);
  if (!r) return {txt: "da giocare", cls: ""};
  return r[1] > r[2] ? {txt: `vinta ${r[1]}-${r[2]}`, cls: "good"} : {txt: `${r[1] === r[2] ? "pareggio" : "persa"} ${r[1]}-${r[2]}`, cls: "bad"};
}
// piano: una squadra diversa per giornata, massima probabilità di superarle tutte (assegnazione, algoritmo ungherese)
function hungarian(C) {   // C: n righe (giornate) x m colonne (squadre), n <= m; restituisce la colonna di ogni riga
  const n = C.length, m = C[0].length, INF = 1e18, u = Array(n + 1).fill(0), v = Array(m + 1).fill(0);
  const p = Array(m + 1).fill(0), way = Array(m + 1).fill(0);
  for (let i = 1; i <= n; i++) {
    p[0] = i; let j0 = 0; const minv = Array(m + 1).fill(INF), used = Array(m + 1).fill(false);
    do {
      used[j0] = true; const i0 = p[j0]; let delta = INF, j1 = 0;
      for (let j = 1; j <= m; j++) if (!used[j]) {
        const cur = C[i0 - 1][j - 1] - u[i0] - v[j];
        if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }
        if (minv[j] < delta) { delta = minv[j]; j1 = j; }
      }
      for (let j = 0; j <= m; j++) { if (used[j]) { u[p[j]] += delta; v[j] -= delta; } else minv[j] -= delta; }
      j0 = j1;
    } while (p[j0] !== 0);
    do { const j1 = way[j0]; p[j0] = p[j1]; j0 = j1; } while (j0);
  }
  const col = Array(n);
  for (let j = 1; j <= m; j++) if (p[j]) col[p[j] - 1] = j - 1;
  return col;
}
const SURV_ALL = 99;   // «tutte»: fino a usare ogni squadra ancora disponibile
function survHorizon() { const h = Number(store.get("f1x2-surv-hz")); return [5, 8, 12, SURV_ALL].includes(h) ? h : 8; }
function survPlan(teams, rounds, W) {   // W: "squadra|giornata" -> probabilità di vittoria
  rounds = rounds.slice(0, teams.length);
  if (!teams.length || !rounds.length) return {picks: [], short: null, all: null};
  const C = rounds.map(r => teams.map(t => -Math.log(Math.max(W[t + "|" + r] || 0, 1e-9))));
  const col = hungarian(C);
  const picks = rounds.map((r, i) => ({round: r, team: teams[col[i]], win: W[teams[col[i]] + "|" + r] || 0}));
  const prod = a => a.reduce((x, y) => x * y, 1);
  return {picks, short: prod(picks.slice(0, 5).map(x => x.win)), all: prod(picks.map(x => x.win))};
}
function viewSurv() {
  const S = D.survivor;
  if (!S || S.round == null) return `<p class="muted">Nessuna giornata di Serie A in arrivo nei dati.</p>`;
  const picks = survPicks(), cur = picks.find(p => p.round === S.round), now = Date.now();
  const used = new Set(picks.filter(p => p.round !== S.round).map(p => p.team));
  const free = S.teams.filter(t => !used.has(t.team)), gone = S.teams.filter(t => used.has(t.team));
  const P = v => v == null ? "—" : Math.round(100 * v) + "%";
  const P1 = v => v == null ? "—" : v > 0 && v < 0.001 ? "1 su " + Math.round(1 / v).toLocaleString("it-IT")
    : (100 * v).toFixed(v < 0.1 ? 2 : 1).replace(".", ",") + "%";
  // piano sulle giornate rimaste: questa dalle quote (se ci sono), le successive dal modello
  const W = {}; (S.win || []).forEach(([t, r, p]) => { W[t + "|" + r] = p; });
  const allTeams = [...new Set(S.teams.map(t => t.team))];
  const rounds = (S.future_rounds || []).filter(r => r >= S.round);
  const avail = allTeams.filter(t => !used.has(t) && !(cur && cur.team === t));
  const hz = survHorizon(), ahead = rounds.slice(0, hz);   // orizzonte: le giornate dalla corrente in poi
  const plan = survPlan(avail, cur ? ahead.filter(r => r > S.round) : ahead, W);
  const H = plan.picks.length;
  const suggested = !cur && plan.picks.length && plan.picks[0].round === S.round ? plan.picks[0].team : null;
  const sugg = free.find(t => t.team === suggested);
  const likeliest = free.find(t => new Date(t.kickoff).getTime() > now);
  const alts = !cur && H ? free.filter(t => new Date(t.kickoff).getTime() > now).slice(0, 8).map(t => {
    const rest = survPlan(avail.filter(x => x !== t.team), ahead.filter(r => r > S.round), W);
    const all = (t.win || 0) * (rest.all ?? 1), short = (t.win || 0) * rest.picks.slice(0, 4).reduce((x, y) => x * y.win, 1);
    return {t, all, short, ratio: plan.all ? all / plan.all : null};
  }) : [];
  const card = (t, isUsed) => {

    const btn = isUsed ? `<span class="muted">già scelta</span>` : chosen

      : !cur && !started ? `<button class="act" data-pick="${esc(t.team)}">Scelgo</button>` : "";
    const lateNote = t.late && t.late.length ? `<div class="warn">⚠ Titolari dati assenti dopo le quote: ${esc(t.late.join(", "))}. La probabilità potrebbe essere superata.</div>` : "";
    return `<div class="card surv ${isUsed ? "used" : ""} ${chosen || (!cur && t.team === suggested) ? "top" : ""}">
      <div><b>${esc(t.team)}</b> ${t.home ? "in casa con" : "in trasferta a"} ${esc(t.opp)}${!cur && t.team === suggested ? ` <span class="badge">piano</span>` : ""}
        <div class="muted">${when(t.kickoff)} · pareggio ${P(t.draw)} · sconfitta ${P(t.loss)} <span class="chip">${esc(t.src)}</span>${started ? " · iniziata" : ""}</div>${lateNote}</div>
      <div style="text-align:right"><span class="big">${P(t.win)}</span><div>${btn}</div></div></div>`;
  };
  const head = cur ? `<div class="headline">Giornata ${S.round}: hai scelto ${esc(cur.team)}.</div>`
    : sugg ? `<div class="headline">Giornata ${S.round}: il piano consiglia ${esc(sugg.team)} (${P(sugg.win)}).</div>
      ${likeliest && likeliest.team !== sugg.team ? `<p class="muted">La più probabile è ${esc(likeliest.team)} (${P(likeliest.win)}), ma conviene tenerla per una giornata più difficile.</p>` : ""}`
    : likeliest ? `<div class="headline">Giornata ${S.round}: la più probabile è ${esc(likeliest.team)} (${P(likeliest.win)}).</div>` : "";
  const planHtml = H ? `<h2>Il piano sulle prossime ${H} giornate</h2>
    <p class="row">Guarda avanti ${[5, 8, 12, SURV_ALL].map(h => `<button class="act" data-hz="${h}" style="${h === hz ? "" : "opacity:.45"}">${h === SURV_ALL ? "tutte" : h}</button>`).join("")} giornate</p>
    ${hz === SURV_ALL ? `<p class="warn">Piano fino a usare tutte le squadre ancora disponibili (${avail.length}). Serve a vedere l'ordine completo: per la scelta di oggi è meno affidabile, perché sacrifica le giornate vicine per quelle lontane, dove il modello è solo indicativo.</p>` : ""}
    <p class="muted">Una squadra diversa per giornata, scelta per avere la massima probabilità di superarle tutte. Giornata ${S.round} dalle quote quando ci sono, le altre dal modello con le forze di oggi: più la giornata è lontana, più il numero è indicativo. Guardare troppo avanti sacrifica le giornate vicine (con 20 giornate la probabilità di superare le prossime 5 scende a meno della metà): 8 è un buon compromesso. Si ricalcola a ogni aggiornamento e dopo ogni tua scelta.</p>
    <div class="card"><div class="row"><div>Superare le prossime ${Math.min(5, H)} giornate: <b>${P1(plan.short)}</b></div><div>Tutte le ${H}: <b>${P1(plan.all)}</b></div></div>
    <div class="scroll"><table><tr><th>Giornata</th><th>Squadra</th><th class="num">Vittoria</th></tr>
    ${plan.picks.map(x => `<tr><td>${x.round}</td><td>${esc(x.team)}</td><td class="num">${P(x.win)}</td></tr>`).join("")}</table></div></div>
    ${alts.length ? `<h2>Quanto costa scegliere un'altra squadra ora</h2>
    <div class="scroll"><table><tr><th>Ora</th><th class="num">Vittoria</th><th class="num">Prossime 5</th><th class="num">Tutto il piano</th></tr>
    ${alts.map(a => `<tr><td>${esc(a.t.team)}</td><td class="num">${P(a.t.win)}</td><td class="num">${P1(a.short)}</td>
      <td class="num ${a.ratio != null && a.ratio < 0.9 ? "bad" : ""}">${a.ratio == null ? "—" : a.ratio > 0.999 ? "il migliore" : "−" + Math.round(100 * (1 - a.ratio)) + "%"}</td></tr>`).join("")}</table></div>
    <p class="muted">«Tutto il piano»: di quanto scende la probabilità di superare tutte le ${H} giornate rispetto al piano migliore, se ora scegli quella squadra e poi giochi al meglio.</p>` : ""}` : "";
  const hist = picks.filter(p => p.round !== S.round);
  return `${head}<p class="note">Una squadra a giornata, mai la stessa due volte fino a fine stagione (${esc(S.season)}). Le squadre già scelte sono in fondo e non contano più. Probabilità di vittoria dalle quote quando ci sono (circa 24 ore prima), altrimenti dal modello. La scelta fatta qui resta su questo dispositivo; quelle nel registro del progetto valgono ovunque.</p>
    ${planHtml}
    <h2>Tutte le squadre della giornata ${S.round}</h2>
    ${free.map(t => card(t, false)).join("")}
    ${gone.length ? `<h2>Già scelte</h2>${gone.map(t => card(t, true)).join("")}` : ""}
    ${hist.length ? `<h2>Le tue scelte</h2><table><tr><th>Giornata</th><th>Squadra</th><th>Esito</th></tr>
      ${hist.map(p => { const o = survOutcome(p); return `<tr><td>${p.round}</td><td>${esc(p.team)}</td><td class="${o.cls}">${esc(o.txt)}</td></tr>`; }).join("")}</table>` : ""}`;
}

const sgn = (v, d = 3) => v == null ? "—" : (v < 0 ? "− " : "+ ") + num(Math.abs(v), d);
function viewModel() {
  const Mo = D.model;
  if (!Mo || !Mo.leagues || !Object.keys(Mo.leagues).length) return `<p class="muted">Parametri del modello non disponibili.</p>`;

      <p class="muted">Depositi ${eur(sumT("deposito"))} · bonus ${eur(sumT("bonus"))} · vincite ${eur(sumT("vincita"))} · prelievi ${eur(sumT("prelievo"))} · schedine ${eur(-staked)} (${plays.length})</p>
      ${moves.length || plays.length ? (saldo < c.stake ? `<p class="bad"><b>Stop.</b> La cassa non copre la prossima schedina: si riparte solo con un bonus o una vincita, non con un nuovo deposito. È la regola che rende il sistema autofinanziato.</p>`
        : netto >= 0 ? `<p class="good">Il sistema si sta ripagando da solo.</p>` : `<p class="muted">Finché «Reso finora» è negativo, i bonus non hanno ancora coperto le perdite.</p>`) : ""}
      <div class="row"><select id="ctype">${Object.entries(CASSA_TYPES).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join("")}</select>
        <input id="cval" inputmode="decimal" placeholder="€" style="width:80px"><button class="act" id="cadd">Aggiungi</button></div>
      ${moves.length ? `<div class="scroll"><table><tr><th>Data</th><th>Movimento</th><th class="num">Importo</th><th></th></tr>
        ${moves.slice().reverse().slice(0, 12).map(m => `<tr><td>${esc(m.d)}</td><td>${esc(CASSA_TYPES[m.t][0])}</td><td class="num">${eur(CASSA_TYPES[m.t][1] * m.v)}</td>
          <td><button class="act" data-cdel="${esc(m.id)}" style="padding:2px 8px;opacity:.7">✕</button></td></tr>`).join("")}</table></div>` : ""}
      <p class="muted">Segna qui il deposito iniziale, i bonus quando li hai convertiti in soldi prelevabili, le vincite incassate e i prelievi. Le schedine si scalano da sole quando premi «L'ho giocata». Tutto resta su questo telefono.</p></div>`;
  // calcolatore dei bonus di benvenuto: valore = bonus − giocate richieste × costo del bookmaker
  const B = bonusCfg(), costOf = code => { const r = C.filter(x => x.code === code && x.cost != null); return r.length ? Math.min(...r.map(x => x.cost)) : null; };
  const bookOpts = [...new Map(C.map(x => [x.code, x.book])).entries()];
  const bCost = costOf(B.book) ?? 0.07, turnover = B.roll * (B.bonus + (B.withDep ? B.dep : 0)), bLoss = turnover * bCost, bVal = B.bonus - bLoss;
  const bonusHtml = `<div class="row"><label>Bookmaker <select id="bbook"><option value="">altro (costo 7%)</option>${bookOpts.map(([k, v]) => `<option value="${esc(k)}" ${k === B.book ? "selected" : ""}>${esc(v)}</option>`).join("")}</select></label></div>
    <div class="row"><label>Bonus € <input id="bbonus" inputmode="decimal" value="${B.bonus}" style="width:70px"></label>
      <label>Deposito € <input id="bdep" inputmode="decimal" value="${B.dep}" style="width:70px"></label></div>
    <div class="row"><label>Da rigiocare <input id="broll" inputmode="decimal" value="${B.roll}" style="width:50px"> volte</label>
      <label>Quota minima <input id="bmin" inputmode="decimal" value="${num(B.minOdds)}" style="width:60px"></label></div>
    <label class="row muted"><input id="bwith" type="checkbox" ${B.withDep ? "checked" : ""}> Si rigioca anche il deposito</label>
    <div class="card trust"><div class="row"><div>Giocate richieste <b>${eur(turnover)}</b></div><div>Costo atteso <b>${eur(-bLoss)}</b></div></div>
      <div class="headline">${bVal > 0 ? `<span class="badge">conviene</span>` : `<span class="badge low">non conviene</span>`} valore ${eur(bVal)}</div>
      <p class="muted">Costo del bookmaker ${num(100 * bCost, 1)}% a giocata${costOf(B.book) != null ? " (misurato sul mercato più economico)" : " (stima)"}. Per spendere il meno possibile: rigioca in singole, a quota appena sopra il minimo${B.minOdds > 2 ? " (una quota minima alta costa di più: il margine cresce con la quota)" : ""}, sul mercato che costa meno in quel bookmaker. Leggi sempre scadenza e mercati ammessi: un bonus non completato in tempo vale zero.</p></div>`;
  return `<p class="note">${esc(D.disclaimer)}</p>
    <h2>Le regole</h2>
    <ol><li><b>Solo singole o doppie.</b> Ogni partita in più moltiplica il margine: con il tuo bookmaker perdi in media il ${num(100 * loss(1), 1)}% sulla singola, il ${num(100 * loss(2), 1)}% sulla doppia, il ${num(100 * loss(3), 1)}% sulla tripla, il ${num(100 * loss(5), 1)}% sulla cinquina.</li>
      <li><b>Sempre la quota più alta</b> tra i bookmaker su cui hai un conto (Info → «Il tuo bookmaker»).</li>
      <li><b>${c.perWeek === 1 ? "Una schedina" : c.perWeek + " schedine"} a settimana da ${eur(c.stake)}</b>, sempre la stessa puntata. Mai aumentarla per rifarsi di una perdita.</li>
      <li><b>Budget del mese ${eur(c.budget)}</b>: finito quello, si smette fino al mese dopo (nei mesi da 5 settimane l'ultima si salta).</li>
      <li><b>Promozioni</b>: se il controllo qui sotto dice «conviene», si gioca quella al posto della schedina della settimana.</li>
      <li><b>Autofinanziamento</b>: dopo il primo deposito la cassa si ricarica solo con bonus e vincite. Se non copre la schedina, si smette.</li></ol>
    <h2>La schedina della settimana</h2>
    ${weekHtml}
    <h2>La cassa</h2>
    ${cassaHtml}
    <h2>Il tuo budget</h2>
    <div class="row"><label>Budget del mese € <input id="sbudget" inputmode="decimal" value="${c.budget}" style="width:70px"></label>
      <label>Puntata € <input id="sstake" inputmode="decimal" value="${c.stake}" style="width:60px"></label>
      <label>Schedine a settimana <input id="sweek" inputmode="numeric" value="${c.perWeek}" style="width:45px"></label></div>
    <p class="muted">Con ${eur(c.stake)} a schedina giochi ${Math.min(Math.floor(c.budget / c.stake), 5 * c.perWeek)} schedine al mese: in media perdi circa ${eur(Math.min(c.budget, 4 * c.perWeek * c.stake) * loss(2))} al mese in doppie, ${eur(Math.min(c.budget, 4 * c.perWeek * c.stake) * loss(1))} in singole. Le oscillazioni di un mese sono molto più grandi di questa media, in su e in giù.</p>
    <h2>Questo mese</h2>
    ${mine.length ? `<div class="card"><div class="row"><div>Giocati <b>${eur(spent)}</b> su ${eur(c.budget)}</div><div>Risultato <b class="${profit >= 0 ? "good" : "bad"}">${eur(profit)}</b></div></div>
      <div class="row"><div>Perdita attesa <b>${eur(-expLoss)}</b></div><div>CLV medio <b>${clvs.length ? pct(clvs.reduce((a, b) => a + b, 0) / clvs.length) : "—"}</b></div></div>
      ${spent >= c.budget ? `<p class="bad">Budget del mese finito.</p>` : ""}${outRule ? `<p class="warn">${outRule === 1 ? "1 schedina" : outRule + " schedine"} con più di 2 partite: fuori dalle regole.</p>` : ""}</div>
      <div class="scroll"><table><tr><th>Data</th><th class="num">Partite</th><th class="num">Quota</th><th class="num">Puntata</th><th>Esito</th><th class="num">Guadagno</th></tr>
      ${mine.map(b => `<tr><td>${esc(b.date)}</td><td class="num">${b.legs}</td><td class="num">${num(b.odds)}</td><td class="num">${eur(b.stake)}</td>
        <td class="${b.status === "vinta" ? "good" : b.status === "persa" ? "bad" : ""}">${esc(b.status)}</td><td class="num">${eur(b.profit)}</td></tr>`).join("")}</table></div>`
      : `<p class="muted">Nessuna giocata registrata questo mese. Le tue giocate reali vanno nel registro del progetto (data/tips/mie_giocate.csv): dimmele e le aggiungo, oppure aggiungile tu. Qui compaiono con esito, perdita attesa e CLV.</p>`}
    <h2>Quanto costa ogni bookmaker</h2>${costTable}
    ${comboHtml}
    <h2>Calcola un bonus di benvenuto</h2>
    <p class="muted">L'unica fonte di valore positivo certo: il bonus del primo deposito vale più di quanto costa rigiocarlo. Scrivi le condizioni del bookmaker.</p>
    ${bonusHtml}
    <h2>Controlla una promozione</h2>
    <p class="muted">Quota maggiorata, anche su multipla: scegli le partite e gli esiti, scrivi la quota della promozione. Il confronto è con la quota giusta calcolata dalle quote di mercato.</p>
    ${promo}`;
}
function bindStrategy() {
  const n = id => Number(String($(id).value).replace(",", "."));
  const save = () => { const b = n("#sbudget"), q = n("#sstake"), w = Math.round(n("#sweek"));
    store.set("f1x2-strat", JSON.stringify({budget: b > 0 ? b : 20, stake: q > 0 ? q : 5, perWeek: w > 0 ? w : 1})); render(); };
  ["#sbudget", "#sstake", "#sweek"].forEach(id => $(id).addEventListener("change", save));
  const pl = $("#played"); if (pl) pl.addEventListener("click", () => {
    store.set("f1x2-strat-played", JSON.stringify(stratPlayed().concat([{week: weekId(Date.now()), at: new Date().toISOString(), stake: stratCfg().stake}]).slice(-200))); render(); });
  const up = $("#unplay"); if (up) up.addEventListener("click", () => {
    const wk = weekId(Date.now()), l = stratPlayed(); const i = l.map(x => x.week).lastIndexOf(wk); if (i >= 0) l.splice(i, 1);
    store.set("f1x2-strat-played", JSON.stringify(l)); render(); });
  const ca = $("#cadd"); if (ca) ca.addEventListener("click", () => {
    const v = n("#cval"); if (!(v > 0)) return;
    store.set("f1x2-cassa", JSON.stringify(cassaMoves().concat([{id: String(Date.now()), d: new Date().toISOString().slice(0, 10), t: $("#ctype").value, v: Math.round(v * 100) / 100}]))); render(); });
  document.querySelectorAll("[data-cdel]").forEach(b => b.addEventListener("click", () => {
    store.set("f1x2-cassa", JSON.stringify(cassaMoves().filter(m => m.id !== b.dataset.cdel))); render(); }));
  const bsave = () => { store.set("f1x2-bonus", JSON.stringify({book: $("#bbook").value, bonus: n("#bbonus"), dep: n("#bdep"), roll: n("#broll"),
    withDep: $("#bwith").checked, minOdds: n("#bmin")})); render(); };
  ["#bbook", "#bbonus", "#bdep", "#broll", "#bmin", "#bwith"].forEach(id => { const el = $(id); if (el) el.addEventListener("change", bsave); });
  document.querySelectorAll("[data-leg]").forEach(s => s.addEventListener("change", () => {
    const l = promoLegs[Number(s.dataset.leg)];
    if (s.dataset.f === "mi") { l.mi = Number(s.value); l.k = 0; } else l.k = Number(s.value);
    render(); }));
  document.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => { promoLegs.splice(Number(b.dataset.rm), 1); render(); }));
  const add = $("#addleg"); if (add) add.addEventListener("click", () => {
    const used = new Set(promoLegs.map(l => l.mi)), m = D.matches.find(x => !used.has(x.id)) || D.matches[0];
    promoLegs.push({mi: m.id, k: 0}); render(); });
  const o = $("#promoodds"); if (o) o.addEventListener("change", () => { store.set("f1x2-promo-odds", o.value); render(); });
  const mx = $("#promomax"); if (mx) mx.addEventListener("change", () => { store.set("f1x2-promo-max", String(Number(String(mx.value).replace(",", ".")) || 10)); render(); });
}

function render() {
  const titles = {slips: "Schedine pronte", matches: "Partite", surv: "Survival · Serie A", track: "Verifica dei consigli", model: "Il modello", strat: "Strategia", info: "Info"};
  $("#title").textContent = titles[tab];
  $("#view").innerHTML = tab === "slips" ? viewSlips() : tab === "matches" ? viewMatches() : tab === "track" ? viewTrack() : tab === "surv" ? viewSurv() : tab === "model" ? viewModel() : tab === "strat" ? viewStrategy() : viewInfo();
  if (tab === "slips") bindSlips();
  if (tab === "matches") bindMatches();
  if (tab === "surv") bindSurv();
  if (tab === "strat") bindStrategy();
  if (tab === "info") {
    $("#logout").addEventListener("click", () => { store.del("f1x2-pw"); location.reload(); });
    $("#selbook").addEventListener("change", e => { store.set("f1x2-book", e.target.value); render(); });
  }
}

const saved = store.get("f1x2-pw");
if (saved) enter(saved, true);
</script>
</body>
</html>
